name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Offline framework tests
        run: python -m pytest -m unit --html=reports/unit.html --log-file=reports/unit.log
      - name: Full API suite
        run: >-
          python -m pytest -m full --html=reports/api.html
          --log-file=reports/api.log --junitxml=reports/junit.xml
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: reports/
          retention-days: 14
