[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonplaceholder-api-tests"
version = "1.0.0"
description = "API test automation for JSONPlaceholder"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.4,<3",
    "urllib3>=2.5,<3",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-html>=4.1,<5"]
dev = ["ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config --html=reports/report.html --self-contained-html"
markers = [
    "smoke: quick checks of core read and write operations (also included in full)",
    "full: all integration tests against the configured API",
    "negative: invalid input and missing resource scenarios",
    "contract: assumed validation behavior with documented JSONPlaceholder deviations",
    "unit: offline tests of framework behavior",
    "users: user resource scenarios",
    "posts: post resource scenarios, including invalid payloads",
    "comments: comments for a post",
]
log_cli = false
log_level = "INFO"
log_file = "reports/test-run.log"
log_file_mode = "w"
log_file_level = "INFO"
log_file_format = "%(asctime)s %(levelname)-8s %(name)s: %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tests"]
